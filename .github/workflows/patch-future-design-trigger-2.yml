name: Patch future design 2
on:
  push:
    paths:
      - '.github/workflows/patch-future-design-trigger-2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/patch_future_design.py
      - run: |
          git config user.name "ChatGPT actions"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Aplicar redesign futurista global"
          git push
