name: Patch recurring shift series actions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-series-actions.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/patch_series_actions.py
      - name: Commit patch
        run: |
          git config user.name "ChatGPT"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Permitir editar ou excluir ocorrencia ou serie de plantao"
          git push
