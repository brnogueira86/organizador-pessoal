name: Patch PWA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-pwa.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply PWA configuration
        run: python scripts/patch_pwa.py
      - name: Commit PWA files
        run: |
          git config user.name "ChatGPT"
          git config user.email "actions@users.noreply.github.com"
          git add index.html icons/
          git commit -m "Transformar Abel Ferreira em aplicativo PWA"
          git push
