name: Patch visual design

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-design.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply design polish
        run: python scripts/patch_design.py
      - name: Commit design
        run: |
          git config user.name "ChatGPT"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Aplicar polimento visual profissional e responsivo"
          git push
