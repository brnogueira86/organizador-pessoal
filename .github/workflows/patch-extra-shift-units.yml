name: Patch extra shift units

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-extra-shift-units.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply extra shift unit calculation
        run: python scripts/patch_extra_shift_units.py
      - name: Commit patch
        run: |
          git config user.name "ChatGPT"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Contar plantões extras por blocos de 12 horas"
          git push
