name: Patch recurrence metadata

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-recurrence.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Save recurrence end date in each generated shift
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = '''            repetir,\n            serieId\n'''
          new = '''            repetir,\n            repetirAte,\n            serieId\n'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly 1 recurrence block, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "ChatGPT"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Salvar data final da recorrencia nos plantoes"
          git push
