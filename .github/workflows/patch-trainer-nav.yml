name: Patch Trainer nav
on:
  push:
    paths: ['.github/workflows/patch-trainer-nav.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: python scripts/patch_trainer_nav.py
      - run: |
          git config user.name "ChatGPT actions"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Adicionar Trainer ao menu principal"
          git push
